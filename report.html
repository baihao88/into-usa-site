<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1, minimum-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui" name="viewport"/>
<meta content="ie=edge" http-equiv="X-UA-Compatible"/>
<link href="vendor/static.ltdcdn.com/assets/cdn/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
<script src="vendor/static.ltdcdn.com/assets/lib/jquery/3.1.1/jquery.min.js"></script>
<script src="vendor/static.ltdcdn.com/assets/lib/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="vendor/static.ltdcdn.com/assets/lib/layer/3.0.1/layer.js"></script>
<title>举报</title>
<style>
    .report {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    .report-content {
      width: 100%;
      height: 400px;
    }
    .nav-bar {
      height: 40px;
      line-height: 40px;
      font-size: 16px;
      background: #eeeeee;
      text-align: center;
    }
    .radio-item {
      padding-left: 40px;
      font-size: 16px;
      height: 40px;
      line-height: 40px;
      border-top: 1px solid whitesmoke;

    }
    .radio-item > input {
      float: right;
      margin-top: 13px;
      margin-right: 50px;
    }
    .radio-item:last-child {
      border-bottom: 1px solid whitesmoke;
      margin-bottom: 0;
    }
    .flex {
      display: flex;
      height: 50px;
      line-height: 50px;
      border-bottom: 1px solid whitesmoke;
      justify-content: start;
      align-items: center;
      padding: 0 40px;
    }
    .top-bar p {
      margin: 0;
      height: 30px;
      line-height: 30px;
      text-align: center;
      background-color: #eeeeee;
      color: #D4D4D4;
    }
  </style>
</head>
<body>
<div class="row report">
<div class="report-content">
<div class="top-bar">
<p>此网页由数字化主体认证中心提供（Trust.eb.ac.cn）</p>
</div>
<div class="nav-bar">
<span aria-hidden="true" class="glyphicon glyphicon-menu-left" id="back" style="float: left; top: 3px;left: 10px; padding:10px; cursor: pointer; "></span>
<p>举报</p>
</div>
<form>
<p style="height: 40px;line-height: 40px; padding-left:20px; margin: 0;">请选择举报原因：</p>
<div class="form-group" style="margin: 0;">
<div class="radio-item">
            存在违法违规信息
            <input checked="" id="reason" name="reason" type="radio" value="存在违法违规信息"/>
</div>
<div class="radio-item">
            存在侵权行为
            <input id="reason" name="reason" type="radio" value="存在侵权行为"/>
</div>
<div class="radio-item">
            有不诚信违约情况
            <input id="reason" name="reason" type="radio" value="有不诚信违约情况"/>
</div>
<div class="radio-item">
            其它
            <input id="reason" name="reason" type="radio" value="其它"/>
</div>
<div id="anther-text" style="text-align: center">
<textarea id="js-textarea" name="anther" placeholder="请输入详细说明" rows="5" style="width: 80%;border: 2px solid whitesmoke;"></textarea>
</div>
</div>
<div class="form-group">
<input class="form-control" id="inputEmail3" name="mobile" placeholder="请输入联系电话" required="" style="width: 80%; margin: 0 auto;" type="tel"/>
</div>
<div class="form-group" style="text-align: center; margin-top: 20px;">
<button class="btn btn-default" id="report-submit" style="width: 80%" type="button">提交</button>
</div>
</form>
</div>
</div>
<script>
    $("#report-submit").on('click', function () {
      var reason = '';
      var mobile = '';
      var extra =  '';
      if(!$("input[name = 'mobile']").val()) {
        layer.msg('请填写手机号')
        $("input[name = 'mobile']").focus()
      } else {
        mobile = $("input[name = 'mobile']").val()
        reason = $("input[name = 'reason']:checked").val()
        extra = $('#js-textarea').val()
        $.ajax({
          url: '/api/inform',
          type: 'post',
          dataType: 'json',
          data: {
            mobile: mobile,
            reason: reason,
            extra: extra
          },
          success: function(res) {
            layer.msg(res.msg)
            if(res.code === 0) {
              setTimeout(()=> {
                history.back(-1);
              }, 3000)
            }
          }
        })
      }
    })
    $('#back').on('click', function (){
      history.back(-1);
    })
  </script>
</body>
</html>
